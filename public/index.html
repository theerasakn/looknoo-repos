<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PawTrip</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body { font-family: 'Noto Sans Thai', 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    #root { display: flex; }
    /* Mobile frame on desktop */
    @media (min-width: 500px) {
      body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; }
      #root { width: 390px; height: 844px; border-radius: 20px; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.4); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
